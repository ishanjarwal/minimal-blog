services:
  app:
    build:
      context: .
      target: runner
    ports:
      - "3000:3000"
    restart: always
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000

  db:
    restart: always
    # Ports deliberately omitted from host mapping to prevent unauthorized remote DB access on VPS
