services:
  migration-service:
    env_file:
      - .env.development
    environment:
      ENV_FILE: .env.development


  minimal-blog-app:
    image: "minimal-blog:${TAG:-v1.0.0}"
    build:
      context: .
      dockerfile: "./Dockerfile"
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env.development
    environment:
      - NODE_ENV=development
      - PORT=3000